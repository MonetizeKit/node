name: CI
on:
  push:
    branches: [main, delivery, development]
  pull_request:
    branches: [main, delivery, development]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  ci:
    uses: MonetizeKit/.github/.github/workflows/reusable-sdk-ci.yml@v1
  required-checks:
    name: Required Checks Gate
    needs: [ci]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify upstream jobs
        run: |
          if [ "${{ needs.ci.result }}" != "success" ]; then
            echo "CI failed or was cancelled: ${{ needs.ci.result }}"
            exit 1
          fi
